name: Nettoyage des aperçus (temporaire)

# Supprime les publications et étiquettes « apercu-* » créées pour vérifier la mise en page avant fusion.
on:
  push:
    branches: [version-2]
    paths: ['.github/workflows/apercu-web.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nettoyage:
    name: Supprimer les aperçus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supprimer les publications et étiquettes apercu-*
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName | select(startswith("apercu-"))'); do
            gh release delete "$tag" -R "$REPO" --cleanup-tag -y && echo "Publication supprimée : $tag"
          done
          for ref in $(gh api "repos/$REPO/git/matching-refs/tags/apercu-" --jq '.[].ref'); do
            gh api -X DELETE "repos/$REPO/git/$ref" && echo "Étiquette supprimée : $ref"
          done
          left=$(gh release list -R "$REPO" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("apercu-"))] | length')
          echo "Aperçus restants : $left"
          test "$left" = "0"
