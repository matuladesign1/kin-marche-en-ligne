name: APK Android

on:
  push:
    branches: [main, etape-1-base-client]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Valeurs PUBLIQUES (protégées par la RLS) — jamais de clé service_role ici.
      EXPO_PUBLIC_SUPABASE_URL: https://trobgcehelmxkvqjtdbo.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rli_t0Z108wF-V5yMc3f_w_9HDXp9_X
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dépendances
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && npx expo install --fix) 2>&1 | tee -a /tmp/build.log
      - name: Générer le projet Android natif
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a /tmp/build.log
      - name: Compiler l'APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a /tmp/build.log
      - name: Résumé de l'erreur (visible dans les annotations)
        if: failure()
        working-directory: .
        run: |
          msg=$(grep -E "error|Error|ERROR|FAILURE|What went wrong|>" /tmp/build.log | tail -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erreur de build::${msg}"
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk ../../KinMarche-${{ github.run_number }}.apk
      - name: Publier en téléchargement (Release GitHub)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "KinMarche-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Kin Marché en ligne — APK de test n°${{ github.run_number }}" \
            --notes "APK de test (signé avec la clé de débogage, non destiné au Play Store). Commit ${{ github.sha }}."
