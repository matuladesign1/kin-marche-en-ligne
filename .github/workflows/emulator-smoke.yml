name: Test sur émulateur Android

# Construit un APK de test pour émulateur (x86_64), l'installe sur un téléphone virtuel Android,
# ouvre les écrans sensibles (magasins, nouvelle adresse, boutons de position, connexion)
# et garde le journal (logcat) et des captures d'écran.
# Lancement : pousser une branche « smoke/... » (ou bouton « Run workflow »).
on:
  push:
    branches: ['smoke/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK de test (émulateur x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://trobgcehelmxkvqjtdbo.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rli_t0Z108wF-V5yMc3f_w_9HDXp9_X
      NODE_ENV: production
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund && npx expo install --fix
      - name: Fichier Firebase
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 -d > google-services.json
            echo "GOOGLE_SERVICES_JSON_PATH=$PWD/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Compiler l'APK (x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  smoke:
    name: Écrans carte, position et connexion
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Google / Facebook côté serveur (fournisseurs activés ?)
        env:
          URL: https://trobgcehelmxkvqjtdbo.supabase.co
          KEY: sb_publishable_rli_t0Z108wF-V5yMc3f_w_9HDXp9_X
        run: |
          echo "== Fournisseurs activés =="
          curl -s -H "apikey: $KEY" "$URL/auth/v1/settings" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: v for k, v in d.get('external', {}).items() if k in ('google','facebook','email')})"
          for p in google facebook; do
            echo "== /authorize $p =="
            curl -s -o body.txt -w 'HTTP %{http_code} -> %{redirect_url}\n' "$URL/auth/v1/authorize?provider=$p&redirect_to=kinmarche%3A%2F%2Fauth-callback" | sed -E 's/(client_id=)[^&]*/\1…/'
            head -c 300 body.txt; echo
          done

      - uses: actions/download-artifact@v4
        with:
          name: apk-x86
          path: apk

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et parcours
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/smoke/smoke.sh

      - name: Captures et journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke-out
