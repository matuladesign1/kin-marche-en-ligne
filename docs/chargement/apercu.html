const RISE = 380, FALL = 340, IMPACT = 90, SETTLE = 380, MORPH = 260;
const CYCLE = RISE + FALL + Math.max(IMPACT + SETTLE, MORPH);
const STEPS = ICONES.length + 1;
const SIZE = 112, H = 104, SHADOW = Math.max(4, SIZE * 0.14);

const quad = (t) => t * t, cubic = (t) => t * t * t;
const out = (f) => (t) => 1 - f(1 - t);

const elastic = (b) => { const p = b * Math.PI; return (t) => 1 - Math.pow(Math.cos((t * Math.PI) / 2), 3) * Math.cos(t * p); };

const lerp = (x, xs, ys) => { // interpolation linéaire par morceaux, prolongée aux extrémités (comme Animated)
  let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++;
  return ys[i] + ((x - xs[i]) / (xs[i + 1] - xs[i])) * (ys[i + 1] - ys[i]);
};

const ball = (step) => {
  if (step === 0) return `<img src="${LOGO}" width="${SIZE}" height="${SIZE}" style="border-radius:50%;display:block">

    <circle cx="24" cy="24" r="23.6" fill="url(#g0)"/><circle cx="24" cy="24" r="23.3" fill="none" stroke="#fff" stroke-width="1.4"/></svg>`;
  const ic = ICONES[step - 1];
  return `<svg viewBox="0 0 48 48" width="${SIZE}" height="${SIZE}"><defs><radialGradient id="g${step}" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f3f3f3"/><stop offset="1" stop-color="#dcdcdc"/></radialGradient></defs>

const loader = $('loader'), shadow = $('shadow'), bl = $('ball'), A = $('a'), B = $('b');

  if (shownB !== next) { B.innerHTML = cache[next] ??= ball(next); shownB = next; }
  const sx = lerp(s, [-1, 0, 1], [0.93, 1, 1.18]), sy = lerp(s, [-1, 0, 1], [1.08, 1, 0.8]);
  const anchor = lerp(s, [-1, 0, 1], [-0.04 * SIZE, 0, 0.1 * SIZE]);
  bl.style.transform = `translateY(${-H * y + anchor}px) rotate(${-9 * y}deg) scaleX(${sx}) scaleY(${sy})`;
  A.style.opacity = lerp(f, [0, 0.5, 1], [1, 1, 0]); A.style.transform = `rotate(${(even ? -70 : 70) * f}deg)`;
  B.style.opacity = lerp(f, [0, 0.5, 1], [0, 1, 1]); B.style.transform = `rotate(${(even ? 70 : -70) * (1 - f)}deg)`;
  shadow.style.opacity = 0.55 + (0.18 - 0.55) * y; shadow.style.transform = `scaleX(${(1 - 0.5 * y) * sx})`;
  document.querySelectorAll('.dot').forEach((d, i) => {
    const v = ((ms % 1500) / 1500) * 3;
    d.style.opacity = lerp(clamp(v / 3) * 3, [0, i, i + 0.5, i + 1, 3], [0.3, 0.3, 1, 0.3, 0.3]);
    d.style.transform = `scale(${lerp(v, [0, i, i + 0.5, i + 1, 3], [1, 1, 1.35, 1, 1])})`;
  });
}

// ?telechargement=62 : état de l'écran de mise à jour (progression réelle dans l'application).
const pct = new URLSearchParams(location.search).get('telechargement');
$('below').innerHTML = pct === null
  ? '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
  : `<div class="version">Nouvelle version n° 16</div>
     <div class="row"><span class="label">${+pct >= 100 ? 'Téléchargement terminé' : 'Téléchargement en cours...'}</span><span class="pct">${pct} %</span></div>
     <div class="track"><div class="fill" style="width:${pct}%"></div></div>
     <div class="bytes">${(57.7 * pct / 100).toFixed(1).replace('.', ',')} Mo sur 57,7 Mo</div>`;
window.seek = frame;
if (!/capture/.test(location.search)) { const t0 = performance.now(); const loop = (t) => { frame(t - t0); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
