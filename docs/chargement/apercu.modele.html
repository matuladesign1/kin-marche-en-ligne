<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement Kin Marché</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; background: #222; display: flex; align-items: center; justify-content: center; }
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(135deg, #DE0000 0%, #CE0000 55%, #A00000 100%); }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px; }
  .loader { position: relative; }
  .shadow { position: absolute; bottom: 0; background: radial-gradient(closest-side, rgba(58,0,0,1), rgba(58,0,0,.55) 60%, rgba(58,0,0,0)); }
  .ball { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .brand { color: #fff; font-size: 28px; font-weight: 900; letter-spacing: 6px; margin-top: 18px; }
  .rule { width: 44px; height: 3px; border-radius: 2px; background: #00B0A8; margin-top: 10px; }
  .tagline { color: rgba(255,255,255,.88); font-size: 15px; margin-top: 12px; text-align: center; }
  .below { margin-top: 28px; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .dots { display: flex; gap: 8px; height: 16px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: #00B0A8; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; align-self: stretch; color: #fff; }
  .label { font-size: 15px; font-weight: 700; }
  .pct { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .track { align-self: stretch; height: 10px; border-radius: 5px; background: rgba(255,255,255,.22); overflow: hidden; }
  .fill { height: 100%; background: #00B0A8; border-radius: 5px; }
  .bytes { align-self: flex-start; color: rgba(255,255,255,.88); font-size: 13px; font-weight: 600; }
  .version { color: rgba(255,255,255,.8); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <div class="loader" id="loader">
      <div class="shadow" id="shadow"></div>
      <div class="ball" id="ball"><div class="layer" id="a"></div><div class="layer" id="b"></div></div>
    </div>
    <div class="brand">KIN MARCHÉ</div>
    <div class="rule"></div>
    <div class="tagline">Votre marché, partout avec vous.</div>
    <div class="below" id="below"></div>
  </div>
</div>
<script>
// Mêmes valeurs que apps/mobile/src/components/KinLoader.tsx.
const ICONES = __ICONES__;
const LOGO = '__LOGO__';
const RISE = 380, FALL = 340, IMPACT = 90, SETTLE = 380, MORPH = 260;
const CYCLE = RISE + FALL + Math.max(IMPACT + SETTLE, MORPH);
const STEPS = ICONES.length + 1;
const SIZE = 112, H = 104, SHADOW = Math.max(4, SIZE * 0.14);

const quad = (t) => t * t, cubic = (t) => t * t * t;
const out = (f) => (t) => 1 - f(1 - t);
const inOut = (f) => (t) => (t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2);
const elastic = (b) => { const p = b * Math.PI; return (t) => 1 - Math.pow(Math.cos((t * Math.PI) / 2), 3) * Math.cos(t * p); };
const clamp = (t) => Math.min(1, Math.max(0, t));
const lerp = (x, xs, ys) => { // interpolation linéaire par morceaux, prolongée aux extrémités (comme Animated)
  let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++;
  return ys[i] + ((x - xs[i]) / (xs[i + 1] - xs[i])) * (ys[i + 1] - ys[i]);
};

const ball = (step) => {
  if (step === 0) return `<img src="${LOGO}" width="${SIZE}" height="${SIZE}" style="border-radius:50%;display:block">
    <svg viewBox="0 0 48 48" width="${SIZE}" height="${SIZE}" style="position:absolute;inset:0"><defs><radialGradient id="g0" cx="0.3" cy="0.2" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <circle cx="24" cy="24" r="23.6" fill="url(#g0)"/><circle cx="24" cy="24" r="23.3" fill="none" stroke="#fff" stroke-width="1.4"/></svg>`;
  const ic = ICONES[step - 1];
  return `<svg viewBox="0 0 48 48" width="${SIZE}" height="${SIZE}"><defs><radialGradient id="g${step}" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f3f3f3"/><stop offset="1" stop-color="#dcdcdc"/></radialGradient></defs>
    <circle cx="24" cy="24" r="23.5" fill="url(#g${step})"/><g transform="translate(24 24) scale(.78) translate(-24 -24)" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    ${ic.paths.map((p) => `<path d="${p.d}" stroke="${p.accent ? '#00B0A8' : '#CE0000'}"/>`).join('')}</g></svg>`;
};

const $ = (id) => document.getElementById(id);
const loader = $('loader'), shadow = $('shadow'), bl = $('ball'), A = $('a'), B = $('b');
loader.style.width = SIZE * 1.3 + 'px'; loader.style.height = H + SIZE + SHADOW + 'px';
Object.assign(shadow.style, { width: SIZE * 0.9 + 'px', height: SHADOW + 'px', left: SIZE * 0.2 + 'px' });
Object.assign(bl.style, { left: SIZE * 0.15 + 'px', top: H + 'px', width: SIZE + 'px', height: SIZE + 'px' });
const cache = {}; let shownA = -1, shownB = -1;

function frame(ms) {
  const k = Math.floor(ms / CYCLE), u = ms - k * CYCLE;
  let y = 0, s = 0, f = 0;
  if (u < RISE) y = out(quad)(u / RISE);
  else if (u < RISE + FALL) { const t = (u - RISE) / FALL; y = 1 - quad(t); s = -cubic(t); }
  else {
    const v = u - RISE - FALL;
    s = v < IMPACT ? -1 + 2 * out(quad)(v / IMPACT) : 1 - elastic(1.4)(clamp((v - IMPACT) / SETTLE));
    f = inOut(cubic)(clamp(v / MORPH));
  }
  const cur = k % STEPS, next = (k + 1) % STEPS, even = k % 2 === 0;
  if (shownA !== cur) { A.innerHTML = cache[cur] ??= ball(cur); shownA = cur; }
  if (shownB !== next) { B.innerHTML = cache[next] ??= ball(next); shownB = next; }
  const sx = lerp(s, [-1, 0, 1], [0.93, 1, 1.18]), sy = lerp(s, [-1, 0, 1], [1.08, 1, 0.8]);
  const anchor = lerp(s, [-1, 0, 1], [-0.04 * SIZE, 0, 0.1 * SIZE]);
  bl.style.transform = `translateY(${-H * y + anchor}px) rotate(${-9 * y}deg) scaleX(${sx}) scaleY(${sy})`;
  A.style.opacity = lerp(f, [0, 0.5, 1], [1, 1, 0]); A.style.transform = `rotate(${(even ? -70 : 70) * f}deg)`;
  B.style.opacity = lerp(f, [0, 0.5, 1], [0, 1, 1]); B.style.transform = `rotate(${(even ? 70 : -70) * (1 - f)}deg)`;
  shadow.style.opacity = 0.55 + (0.18 - 0.55) * y; shadow.style.transform = `scaleX(${(1 - 0.5 * y) * sx})`;
  document.querySelectorAll('.dot').forEach((d, i) => {
    const v = ((ms % 1500) / 1500) * 3;
    d.style.opacity = lerp(clamp(v / 3) * 3, [0, i, i + 0.5, i + 1, 3], [0.3, 0.3, 1, 0.3, 0.3]);
    d.style.transform = `scale(${lerp(v, [0, i, i + 0.5, i + 1, 3], [1, 1, 1.35, 1, 1])})`;
  });
}

// ?telechargement=62 : état de l'écran de mise à jour (progression réelle dans l'application).
const pct = new URLSearchParams(location.search).get('telechargement');
$('below').innerHTML = pct === null
  ? '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
  : `<div class="version">Nouvelle version n° 16</div>
     <div class="row"><span class="label">${+pct >= 100 ? 'Téléchargement terminé' : 'Téléchargement en cours...'}</span><span class="pct">${pct} %</span></div>
     <div class="track"><div class="fill" style="width:${pct}%"></div></div>
     <div class="bytes">${(57.7 * pct / 100).toFixed(1).replace('.', ',')} Mo sur 57,7 Mo</div>`;
window.seek = frame;
if (!/capture/.test(location.search)) { const t0 = performance.now(); const loop = (t) => { frame(t - t0); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
